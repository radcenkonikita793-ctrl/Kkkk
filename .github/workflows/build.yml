name: Production iOS IPA Build Pipeline

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Принудительно очистить кэш движка'
        required: false
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"
  PROJECT_ZIP_NAME: "Aerdow1.0.zip"
  APP_SCHEME: "Aerdrom"

jobs:
  environment-diagnostics:
    name: 🔍 1. Проверка окружения и зависимостей
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Audit & Tooling Verification
        run: |
          echo "=== ДИАГНОСТИКА СИСТЕМЫ ==="
          uname -a
          sw_vers
          xcodebuild -version
          echo "Доступный диск:"
          df -h

      - name: Verify Release Assets Presence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Проверка наличия файла $PROJECT_ZIP_NAME в релизах..."
          gh release view --json assets | grep -q "$PROJECT_ZIP_NAME" && echo "Файл найден!" || { echo "Файл не найден в релизе!"; exit 1; }

  build-and-export:
    name: ✈️ 2. Сборка и компиляция IPA
    needs: environment-diagnostics
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Godot Engine & Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /Applications/Godot.app
            ~/Library/Application Support/Godot/export_templates/
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Install Godot Engine & Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true' || inputs.clean_cache == true
        run: |
          echo "Кэш не найден. Загрузка движка Godot ${{ env.GODOT_VERSION }}..."
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app
          rm godot.zip

          echo "Установка шаблонов экспорта..."
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}/ios.zip"
          rm templates.tpz

      - name: Safe Download Project Asset
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: 'latest'
          file: ${{ env.PROJECT_ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack & Reconstruct Project Workspace
        run: |
          echo "Проверка целостности архива..."
          ls -lh "${{ env.PROJECT_ZIP_NAME }}"
          
          mkdir -p raw_project workspace
          unzip -qo "${{ env.PROJECT_ZIP_NAME }}" -d raw_project/

          # Динамический поиск файла project.godot
          PROJECT_ROOT=$(find raw_project -name "project.godot" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Файл project.godot не найден в архиве!"
            exit 1
          fi

          echo "Найден корень проекта: $PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/* workspace/
          
          echo "Содержимое workspace:"
          ls -la workspace/

      - name: Export Xcode Project via Headless Godot
        run: |
          mkdir -p workspace/build/ios
          echo "Экспорт в Xcode..."
          /Applications/Godot.app/Contents/MacOS/Godot \
            --path workspace \
            --headless \
            --export-release "iOS" "$PWD/workspace/build/ios/${{ env.APP_SCHEME }}.xcodeproj"

      - name: Compile Unsigned Xcode Archive
        run: |
          cd workspace/build/ios
          
          xcodebuild archive \
            -project "${{ env.APP_SCHEME }}.xcodeproj" \
            -scheme "${{ env.APP_SCHEME }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "build/${{ env.APP_SCHEME }}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          cd workspace/build/ios
          mkdir -p Payload
          cp -r "build/${{ env.APP_SCHEME }}.xcarchive/Products/Applications/"*.app Payload/
          zip -r -y "${{ env.APP_SCHEME }}_unsigned.ipa" Payload/
          
          echo "Итоговый размер IPA:"
          ls -lh "${{ env.APP_SCHEME }}_unsigned.ipa"

      - name: Upload Final IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-iOS-IPA-Release
          path: workspace/build/ios/${{ env.APP_SCHEME }}_unsigned.ipa
          retention-days: 7
          compression-level: 6
