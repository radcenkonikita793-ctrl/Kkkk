name: Build iOS IPA

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"

jobs:
  build-unsigned-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot & Templates
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app
          
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}/ios.zip"

      - name: Download & Extract Project Archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Скачиваем релиз через GitHub CLI..."
          # gh release download автоматически находит и скачивает архив из последнего релиза
          gh release download --pattern "*.zip" --clobber

          # Находим имя скачанного архива
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Скачан файл: $ZIP_FILE"

          # Распаковываем во временную папку
          mkdir -p raw_project
          unzip -qo "$ZIP_FILE" -d raw_project/

          # Создаем рабочую директорию
          mkdir -p workspace

          # Проверяем структуру: если файлы проекта внутри вложенной папки — извлекаем всё оттуда
          if [ -f raw_project/project.godot ]; then
            echo "Проект расположен в корне архива"
            cp -R raw_project/* workspace/
          else
            echo "Проект находится во вложенной папке архива, извлекаем всё..."
            INNER_DIR=$(find raw_project -maxdepth 2 -name "project.godot" -exec dirname {} \;)
            cp -R "$INNER_DIR"/* workspace/
          fi

          echo "Содержимое папки workspace:"
          ls -la workspace/

      - name: Export Xcode Project
        run: |
          mkdir -p workspace/build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --path workspace --headless --export-release "iOS" "$PWD/workspace/build/ios/Aerdrom.xcodeproj"

      - name: Build IPA
        run: |
          cd workspace/build/ios
          xcodebuild archive -project Aerdrom.xcodeproj -scheme Aerdrom -sdk iphoneos -configuration Release -archivePath build/Aerdrom.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""
          mkdir -p Payload
          cp -r build/Aerdrom.xcarchive/Products/Applications/*.app Payload/
          zip -r Aerdrom.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-iOS-IPA
          path: workspace/build/ios/Aerdrom.ipa
