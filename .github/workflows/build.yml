name: Get Me My IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot Engine
        run: |
          curl -L -s -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          curl -L -s -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/ios.zip"

      - name: Extract Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Скачиваем файл встроенной и самой надежной утилитой GitHub
          gh release download --pattern "aerdow1.0.zip"
          
          mkdir raw workspace
          unzip -q aerdow1.0.zip -d raw/
          
          # Находим, где именно лежит project.godot, и копируем всё в workspace
          ROOT_DIR=$(find raw -name "project.godot" -exec dirname {} \;)
          cp -R "$ROOT_DIR"/* workspace/

      - name: Export & Package IPA
        run: |
          mkdir -p build
          # Делаем Xcode проект
          /Applications/Godot.app/Contents/MacOS/Godot --path workspace --headless --export-release "iOS" "$PWD/build/Aerdrom.xcodeproj"
          
          # Собираем неподписанное приложение
          cd build
          xcodebuild archive -project Aerdrom.xcodeproj -scheme Aerdrom -sdk iphoneos -configuration Release -archivePath Aerdrom.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          
          # Упаковываем в IPA
          mkdir Payload
          cp -r Aerdrom.xcarchive/Products/Applications/*.app Payload/
          zip -r Aerdrom.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-Ready-IPA
          path: build/Aerdrom.ipa
