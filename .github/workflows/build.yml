name: Aerdrom Advanced Aerospace Pipeline

on:
  workflow_dispatch:
    inputs:
      verbose_logging:
        description: 'Enable deep trace logging'
        required: true
        default: 'true'
        type: boolean

# КРИТИЧЕСКИ ВАЖНО: Явная выдача прав токену на чтение скрытых релизов и кода
permissions:
  contents: read
  packages: read

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"
  ASSET_NAME: "aerdow1.0.zip"
  APP_NAME: "Aerdrom"
  STUDIO_ID: "Nikitaerw800"

jobs:
  hyper-build-orchestration:
    name: ⚙️ Hyper-Threaded Compilation Core
    runs-on: macos-14
    timeout-minutes: 120
    
    steps:
      - name: 📦 Phase 1: Secure Source Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔬 Phase 2: Quantum Diagnostics & Toolchain Audit
        run: |
          set -e
          echo -e "\033[1;36m====================================================\033[0m"
          echo -e "\033[1;36m      AERDROM FLIGHT SIMULATOR BUILD INITIATED      \033[0m"
          echo -e "\033[1;36m====================================================\033[0m"
          echo "System Architecture:"
          uname -mprs
          echo "Xcode Environment:"
          xcodebuild -version | awk 'NR==1{print $0}'
          echo "GitHub CLI Version:"
          gh --version | awk 'NR==1{print $0}'
          echo -e "\033[1;32m[OK] Diagnostics completed.\033[0m"

      - name: 🛠️ Phase 3: Bootstrap Engine & Template Injection
        run: |
          set -eo pipefail
          
          # Функция для надежного скачивания движка
          download_with_retry() {
            local url=$1
            local output=$2
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo -e "\033[1;33m[Attempt $attempt/$max_attempts] Fetching $output...\033[0m"
              if curl -L -s --fail --retry 3 --retry-delay 2 -o "$output" "$url"; then
                echo -e "\033[1;32m[Success] $output downloaded.\033[0m"
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            echo -e "\033[1;31m[Fatal] Failed to download $output after $max_attempts attempts.\033[0m"
            return 1
          }

          echo "-> Bootstrapping Godot Engine $GODOT_VERSION..."
          download_with_retry "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" "godot_engine.zip"
          unzip -q godot_engine.zip
          mv Godot.app /Applications/Godot.app
          rm godot_engine.zip
          
          echo "-> Injecting iOS Export Templates..."
          TEMPLATE_BASE="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          mkdir -p "$TEMPLATE_BASE"
          
          download_with_retry "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" "templates.tpz"
          unzip -q templates.tpz
          mv templates/ios.zip "$TEMPLATE_BASE/ios.zip"
          rm -rf templates templates.tpz
          
          echo -e "\033[1;32m[OK] Engine toolchain fully operational.\033[0m"

      - name: 📥 Phase 4: Omnidirectional Release Asset Locator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo -e "\033[1;34m>>> ACTIVATING OMNIDIRECTIONAL ASSET SEARCH <<<\033[0m"
          echo "Target Asset: $ASSET_NAME"
          
          # Шаг 1: Получаем список ВООБЩЕ ВСЕХ релизов (стабильные, черновики, pre-release)
          echo "-> Scanning repository release matrix..."
          RELEASES=$(gh release list --exclude-drafts=false --limit 100 | awk '{print $1}')
          
          if [ -z "$RELEASES" ]; then
            echo -e "\033[1;31m[Error] Repository contains zero releases or token lacks read access.\033[0m"
            exit 1
          fi
          
          ASSET_DOWNLOADED=false
          
          # Шаг 2: Циклический перебор каждого релиза в поисках нужного файла
          for tag in $RELEASES; do
            echo -e "\033[1;33m-> Inspecting release tag: [$tag]...\033[0m"
            
            # Попытка скачать файл через встроенный GitHub CLI
            if gh release download "$tag" --pattern "$ASSET_NAME" --clobber > /dev/null 2>&1; then
              echo -e "\033[1;32m[BULLSEYE] Asset $ASSET_NAME found and extracted from release $tag!\033[0m"
              ASSET_DOWNLOADED=true
              break
            else
              echo "   - Asset not present in $tag."
            fi
          done
          
          # Шаг 3: Верификация целостности квантов (проверка файла)
          if [ "$ASSET_DOWNLOADED" = false ]; then
            echo -e "\033[1;31m[FATAL ERROR] Comprehensive search failed. File $ASSET_NAME does not exist in any release.\033[0m"
            echo "Available tags were: $RELEASES"
            exit 1
          fi
          
          FILE_SIZE_BYTES=$(stat -f%z "$ASSET_NAME")
          echo "-> Payload size: $FILE_SIZE_BYTES bytes"
          
          if [ "$FILE_SIZE_BYTES" -lt 2048 ]; then
             echo -e "\033[1;31m[Corruption] File is unusually small (under 2KB). It might be an error text masked as a zip.\033[0m"
             cat "$ASSET_NAME"
             exit 1
          fi

      - name: 🧩 Phase 5: Autonomous Workspace Reconstruction
        run: |
          set -e
          echo -e "\033[1;35m>>> INITIATING DECOMPRESSION & RECONSTRUCTION <<<\033[0m"
          
          mkdir -p raw_payload workspace
          unzip -qo "$ASSET_NAME" -d raw_payload/
          rm "$ASSET_NAME"
          
          # Автоматический поиск проектного ядра (project.godot)
          echo "-> Executing deep filesystem traversal..."
          PROJECT_ROOT_DIR=$(find raw_payload -type f -name "project.godot" -exec dirname {} \; | awk 'NR==1{print $0}')
          
          if [ -z "$PROJECT_ROOT_DIR" ]; then
             echo -e "\033[1;31m[FATAL] Neural search failed to locate project.godot. Invalid Godot project structure.\033[0m"
             exit 1
          fi
          
          echo -e "\033[1;32m[OK] Core located at: $PROJECT_ROOT_DIR\033[0m"
          echo "-> Moving matrix to isolated workspace..."
          
          # Синхронизация файлов в корень workspace
          rsync -a "$PROJECT_ROOT_DIR/" workspace/
          rm -rf raw_payload
          
          echo "Workspace tree established:"
          ls -1A workspace/ | head -n 10

      - name: 🍏 Phase 6: Headless Engine Binary Compilation
        run: |
          set -e
          echo -e "\033[1;36m>>> STARTING HEADLESS XCODE EXPORT <<<\033[0m"
          
          mkdir -p workspace/build/ios
          
          # Запуск Godot без интерфейса для генерации кода C++/Objective-C
          /Applications/Godot.app/Contents/MacOS/Godot \
            --path workspace \
            --headless \
            --export-release "iOS" \
            "$PWD/workspace/build/ios/$APP_NAME.xcodeproj" \
            > /dev/null 2>&1 || echo "Export finished (warnings suppressed)."
            
          if [ ! -f "workspace/build/ios/$APP_NAME.xcodeproj/project.pbxproj" ]; then
             echo -e "\033[1;31m[FATAL] Engine failed to generate Xcode project structure.\033[0m"
             exit 1
          fi
          echo -e "\033[1;32m[OK] Xcode projection successful.\033[0m"

      - name: 🏗️ Phase 7: Advanced Unsigned Xcodebuild Matrix
        run: |
          set -eo pipefail
          cd workspace/build/ios
          echo -e "\033[1;33m>>> TRIGGERING LOW-LEVEL LLVM COMPILATION <<<\033[0m"
          
          # Сложная сборка с принудительным отключением всех проверок сертификатов Apple
          xcodebuild archive \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_BITCODE=NO \
            GCC_OPTIMIZATION_LEVEL=s \
            | grep -v "Wdeprecated" | tail -n 50 || true
            
          echo "-> Assembling Payload container..."
          mkdir -p Payload
          
          APP_DIR=$(find "build/$APP_NAME.xcarchive/Products/Applications" -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
             echo -e "\033[1;31m[FATAL] LLVM failed to produce .app binary wrapper.\033[0m"
             exit 1
          fi
          
          cp -R "$APP_DIR" Payload/
          echo -e "\033[1;32m[OK] Binary wrapper staged.\033[0m"

      - name: 🎁 Phase 8: Final Cryptographic Packaging
        run: |
          set -e
          cd workspace/build/ios
          echo -e "\033[1;35m>>> INITIATING MAXIMUM COMPRESSION PACKAGING <<<\033[0m"
          
          # Сжатие с параметром -9 для максимальной плотности архива
          zip -r -9 -q "${APP_NAME}_Unsigned.ipa" Payload/
          
          FINAL_SIZE=$(ls -lh "${APP_NAME}_Unsigned.ipa" | awk '{print $5}')
          echo -e "\033[1;32m====================================================\033[0m"
          echo -e "\033[1;32m [SUCCESS] IPA GENERATED: $FINAL_SIZE\033[0m"
          echo -e "\033[1;32m====================================================\033[0m"

      - name: ☁️ Phase 9: Secure Artifact Distribution
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-iOS-Sideload-Ready-IPA
          path: workspace/build/ios/*_Unsigned.ipa
          retention-days: 14
          compression-level: 0 # Отключаем дополнительное сжатие, т.к. zip уже сжал на максимуме
          if-no-files-found: error
