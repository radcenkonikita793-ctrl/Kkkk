name: Build iOS IPA

on:
  workflow_dispatch: # Позволяет запускать экшен вручную
  # Раскомментируй строки ниже, если хочешь, чтобы сборка запускалась при пуше
  # push:
  #   branches: [ "main" ]

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest # Для сборки iOS обязательно нужен мак

    steps:
      # 1. Получаем код из репозитория
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Устанавливаем движок (здесь должен быть твой скрипт установки Godot)
      - name: Install Godot & Templates
        run: |
          echo "Здесь выполняется твой скрипт установки Godot..."
          # Например: brew install godot

      # 3. ИСПРАВЛЕННЫЙ ШАГ: Безопасное скачивание ассета
      - name: Download Release Asset Safely
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'radcenkonikita793-ctrl/Kkkk'
          # ВАЖНО: замени 'project_data.zip' на реальное имя файла из твоего релиза!
          file: 'project_data.zip'
          # Обязательно передаем токен, чтобы убрать ошибку 404
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Распаковываем скачанный архив
      - name: Extract Project Archive
        run: |
          # ВАЖНО: имя файла здесь должно совпадать с именем в шаге 3
          unzip project_data.zip -d ./extracted_project

      # 5. Экспортируем проект в Xcode (здесь твой скрипт Godot)
      - name: Export Xcode Project
        run: |
          echo "Здесь выполняется экспорт проекта Godot..."
          # Например: godot --headless --export-debug "iOS" ./build/ios/project.ipa
